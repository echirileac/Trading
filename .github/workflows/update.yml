name: Update NATGAS forecast

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub's shortest schedule; runs can start a few minutes late
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Fetch prices + news, build forecast
        run: node scripts/update.mjs
        env:
          NEWS_EVERY_MIN: "15"
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}   # free AI analyst key (console.groq.com)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}  # optional paid upgrade
          AI_PROVIDERS: ${{ vars.AI_PROVIDERS }}      # optional order, default anthropic,groq (a provider without a key is skipped)
          GROQ_MODELS: ${{ vars.GROQ_MODELS }}        # optional, default openai/gpt-oss-120b,openai/gpt-oss-20b
          AI_MODEL: ${{ vars.AI_MODEL }}          # optional repo variable, default claude-sonnet-5-5
          AI_EVERY_MIN: ${{ vars.AI_EVERY_MIN }}  # optional, default 60
          NEWS_AI_MODELS: ${{ vars.NEWS_AI_MODELS }}          # optional, default llama-3.3-70b-versatile,llama-3.1-8b-instant (headline scoring)
          NEWS_AI_CATEGORIES: ${{ vars.NEWS_AI_CATEGORIES }}  # optional, default equity,etf (add energy,metal,index,fx,crypto to extend)
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}  # optional: alerts to Telegram (bot from @BotFather)
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}      # optional: your chat with the bot
          ALERT_TYPES: ${{ vars.ALERT_TYPES }}                   # optional, default move,level,flip,analyst,event
          ALERT_MARKETS: ${{ vars.ALERT_MARKETS }}               # optional, e.g. NATGAS,BRENT (default all)
          ALERT_QUIET_HOURS: ${{ vars.ALERT_QUIET_HOURS }}       # optional, e.g. 23-7: sent without sound (Bucharest time)
          ALERT_EVENT_LEAD_MIN: ${{ vars.ALERT_EVENT_LEAD_MIN }} # optional, default 60
          ALERT_TZ: ${{ vars.ALERT_TZ }}                         # optional, default Europe/Bucharest
          # SITE_URL: "https://your-custom-domain.example/"   # only if you use a custom domain
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Make sure the 5-minute ticker is running
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          running=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ticker.yml --status in_progress --json databaseId --jq length || echo 1)
          queued=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ticker.yml --status queued --json databaseId --jq length || echo 1)
          pending=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ticker.yml --status pending --json databaseId --jq length || echo 0)
          if [ "$running" = "0" ] && [ "$queued" = "0" ] && [ "$pending" = "0" ]; then
            gh workflow run ticker.yml --repo "$GITHUB_REPOSITORY" --ref main && echo "Ticker restarted"
          fi
