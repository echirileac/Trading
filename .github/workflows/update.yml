name: Update NATGAS forecast

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub's shortest schedule; runs can start a few minutes late
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Fetch prices + news, build forecast
        run: node scripts/update.mjs
        env:
          NEWS_EVERY_MIN: "15"
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          # SITE_URL: "https://your-custom-domain.example/"   # only if you use a custom domain
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
