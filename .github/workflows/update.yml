name: Update NATGAS forecast

on:
  schedule:
    - cron: "*/15 * * * *"   # backup only: the ticker starts the regular updates; this also restarts the ticker if it stopped
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Fetch prices + news, build forecast
        run: node scripts/update.mjs
        env:
          NEWS_EVERY_MIN: "15"
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}   # free AI analyst key (console.groq.com)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}  # optional paid upgrade
          AI_PROVIDERS: ${{ vars.AI_PROVIDERS }}      # optional order, default anthropic,groq (a provider without a key is skipped)
          GROQ_MODELS: ${{ vars.GROQ_MODELS }}        # optional, default openai/gpt-oss-120b,openai/gpt-oss-20b
          AI_MODEL: ${{ vars.AI_MODEL }}          # optional repo variable, default claude-sonnet-5-5
          AI_EVERY_MIN: ${{ vars.AI_EVERY_MIN }}  # optional, default 60
          NEWS_AI_MODELS: ${{ vars.NEWS_AI_MODELS }}          # optional, default openai/gpt-oss-20b,openai/gpt-oss-120b (headline scoring)
          NEWS_AI_CATEGORIES: ${{ vars.NEWS_AI_CATEGORIES }}  # optional, default equity,etf (add energy,metal,index,fx,crypto to extend)
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}  # optional: alerts to Telegram (bot from @BotFather)
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}      # optional: your chat with the bot
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}            # optional: the page asks for this password; data is published encrypted
          SITE_PASSWORD_OLD: ${{ secrets.SITE_PASSWORD_OLD }}    # only while changing or removing the password: the previous one
          ALERT_TYPES: ${{ vars.ALERT_TYPES }}                   # optional, default move,level,flip,analyst,event
          ALERT_MARKETS: ${{ vars.ALERT_MARKETS }}               # optional, e.g. NATGAS,BRENT (default all)
          ALERT_QUIET_HOURS: ${{ vars.ALERT_QUIET_HOURS }}       # optional, e.g. 23-7: sent without sound (Bucharest time)
          ALERT_EVENT_LEAD_MIN: ${{ vars.ALERT_EVENT_LEAD_MIN }} # optional, default 60
          ALERT_TZ: ${{ vars.ALERT_TZ }}                         # optional, default Europe/Bucharest
          ALERT_STEP_PCT: ${{ vars.ALERT_STEP_PCT }}             # optional, default 0.5 (% move between price alerts; 0 = off)
          ALERT_STEP_MARKETS: ${{ vars.ALERT_STEP_MARKETS }}     # optional, e.g. NATGAS,BRENT (default all)
          MTF_WEIGHT: ${{ vars.MTF_WEIGHT }}                     # optional, default 0.15: share of the lean given to the timeframe reading (0 = shown, not counted; max 0.5)
          # SITE_URL: "https://your-custom-domain.example/"   # only if you use a custom domain
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Check the live site really shows this build
        # GitHub can report "Reported success!" for a deploy while the live site keeps serving an older
        # one (12 Nov 2026: frozen for an hour). Read the live data file and fail loudly if it is older
        # than what this run just built, so the problem shows up as a red run instead of silently.
        # With the password lock on, index.json is encrypted and carries its build time as `at`.
        if: steps.deployment.outcome == 'success'
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          built=$(node -e "const j=JSON.parse(require('fs').readFileSync('site/data/index.json','utf8')); console.log(j.generatedAt||j.at||'')")
          live=""
          for i in 1 2 3 4 5 6 7 8; do
            live=$(curl -fsS --max-time 15 "${PAGE_URL}data/index.json?t=$(date +%s)" 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s);console.log(j.generatedAt||j.at||'')}catch{console.log('')}})" || true)
            if [ -n "$live" ] && [[ ! "$live" < "$built" ]]; then echo "Live site is current (built $built, live $live)"; exit 0; fi
            sleep 10
          done
          echo "::error title=Live site is stale::Deploy reported success, but the live site still shows data from ${live:-nothing} (this run built $built)."
          exit 1
      - name: Make sure the ticker is running
        # Checked every 10 minutes (and on scheduled/push runs) to stay well inside GitHub's
        # 1,000 API requests an hour for the built-in token.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ $(( 10#$(date -u +%M) % 10 )) -ne 0 ]; then exit 0; fi
          active=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ticker.yml --limit 5 --json status --jq '[.[] | select(.status != "completed")] | length' || echo 1)
          if [ "$active" = "0" ]; then
            gh workflow run ticker.yml --repo "$GITHUB_REPOSITORY" --ref main && echo "Ticker restarted"
          fi
